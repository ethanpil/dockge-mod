services:
  dockge-mod:
    image: ethanpil/dockge-mod:latest
    restart: unless-stopped
    ports:
      # Host port : container port
      - 5001:5001
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data

      # Private registries: share your Docker credentials
      # - /root/.docker:/root/.docker:ro

      # The stacks directory. Use an absolute path, and the same path on
      # both sides, or compose resolves relative paths in your stacks wrong.
      - /opt/stacks:/opt/stacks
    environment:
      - DOCKGE_STACKS_DIR=/opt/stacks
