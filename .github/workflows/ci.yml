name: CI

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '*.md'
  # The publish workflow calls this, so an image is never pushed without
  # a passing check
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install the dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check the types
        run: npm run check-ts

      - name: Run the tests
        run: npm test

      - name: Build the frontend
        run: npm run build:frontend

  # Build the image and start it, so a broken Dockerfile or a missing
  # runtime file fails here and not after a publish
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build the image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: release
          platforms: linux/amd64
          push: false
          load: true
          tags: dockge-mod:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true

      - name: Start the image and wait for the setup page
        run: |
          docker run -d --name smoke -p 5001:5001 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e DOCKGE_STACKS_DIR=/opt/stacks \
            dockge-mod:ci
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:5001/ | grep -q '<div id="app"'; then
              echo "The server answers"
              exit 0
            fi
            sleep 2
          done
          docker logs smoke
          exit 1

      - name: Wait for the healthcheck
        run: |
          # The first check runs one interval (60 s) after the start
          for i in $(seq 1 75); do
            status=$(docker inspect --format '{{.State.Health.Status}}' smoke)
            if [ "$status" = "healthy" ]; then
              echo "healthy"
              exit 0
            fi
            sleep 2
          done
          docker inspect --format '{{json .State.Health}}' smoke
          exit 1
