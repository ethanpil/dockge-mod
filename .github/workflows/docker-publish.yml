name: Publish Docker Image

on:
  workflow_dispatch:

# Two runs that push the same tag must not race each other
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Make the version and the tags
        id: meta
        run: |
          set -eu
          BASE="$(node -p "require('./package.json').version")"
          VERSION="${BASE}-mod-$(git rev-parse --short HEAD)"
          TAGS="ethanpil/dockge-mod:${VERSION}"
          # Only the default branch moves the latest tag
          if [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            TAGS="${TAGS},ethanpil/dockge-mod:latest"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${VERSION}"
          echo "Tags: ${TAGS}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ethanpil
          password: ${{ secrets.DOCKER_HUB_KEY }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: release
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=dockge-mod
            org.opencontainers.image.source=https://github.com/ethanpil/dockge-mod
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          # A cache error must not fail a build that is already pushed
          cache-to: type=gha,mode=max,ignore-error=true
