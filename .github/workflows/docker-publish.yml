name: Publish Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read

# Two runs that push the same tag must not race each other
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The lint, the tests, and a start of the image must pass first
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Make the version and the tags
        id: meta
        run: |
          set -eu
          BASE="$(node -p "require('./package.json').version")"
          VERSION="${BASE}-mod-$(git rev-parse --short HEAD)"
          TAGS="ethanpil/dockge-mod:${VERSION}"
          # Only the default branch moves the latest tag
          if [ "${GITHUB_REF}" = "refs/heads/master" ]; then
            TAGS="${TAGS},ethanpil/dockge-mod:latest"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "Publishing ${VERSION}"
          echo "Tags: ${TAGS}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ethanpil
          password: ${{ secrets.DOCKER_HUB_KEY }}

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/Dockerfile
          target: release
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=dockge-mod
            org.opencontainers.image.source=https://github.com/ethanpil/dockge-mod
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          # A cache error must not fail a build that is already pushed
          cache-to: type=gha,mode=max,ignore-error=true
